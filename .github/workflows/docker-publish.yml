name: Docker

on:
  push:
    branches: [ "master" ]
    # Only tag + build when a change affects the built image.
    paths:
      - '**'
      - '!**.md'
      - '!**.rst'
      - '!docs/**'
      - '!.github/**'
      - '!renovate.json'
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jescholl/certbot-dns-namecheap

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write  # for creating tags
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history required for auto-tag

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The final stage doesn't depend on the test stage, so BuildKit skips it
      # unless it's targeted. Runs before tagging so a failure cuts no release.
      - name: Run tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          cache-from: type=gha

      - name: Auto-tag
        id: autotag
        if: github.event_name != 'pull_request'
        uses: phish108/autotag-action@6dcf3d78f00f1a55df67a02428af3f1b862da6dc # v1.1.64
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        run: |
          PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')

          gh release create ${{ steps.autotag.outputs.new-tag }} \
            --generate-notes \
            --title "${{ steps.autotag.outputs.new-tag }}"

          # --generate-notes only lists merged PRs; pushes made directly to the
          # default branch (no PR) yield a bare compare-link with no bullets.
          # Fall back to the raw commit log in that case.
          BODY=$(gh release view ${{ steps.autotag.outputs.new-tag }} --json body --jq .body)
          if ! grep -q "## What's Changed" <<< "$BODY"; then
            COMMITS=$(git log --no-merges --pretty="format:* %s (%h)" "${PREV_TAG:+$PREV_TAG..}HEAD")
            NOTES=$(printf "## What's Changed\n%s\n\n%s\n" "$COMMITS" "$BODY")
            gh release edit ${{ steps.autotag.outputs.new-tag }} --notes "$NOTES"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Login against a Docker registry except on PR
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.autotag.outputs.new-tag }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Build and push Docker image with Buildx (don't push on PR)
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
